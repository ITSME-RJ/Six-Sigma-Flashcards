<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>Six Sigma Flashcards</title><style>
:root{--bg:#f4f7fb;--p:#fff;--ink:#172033;--muted:#667085;--line:#e4e9f2;--accent:#4f46e5;--ok:#16794a;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#eef2ff,#fafafa 55%,#f5f3ff);color:var(--ink);min-height:100vh}.app{max-width:920px;margin:auto;padding:18px 16px 38px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem)}.top p{margin:4px 0;color:var(--muted)}.pill,.panel,.card,.quiz{background:var(--p);border:1px solid var(--line);box-shadow:0 14px 40px #17203318}.pill{padding:8px 12px;border-radius:999px;font-weight:700}.panel{margin:15px 0;padding:12px;border-radius:18px;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:9px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--p);color:var(--ink)}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.btn{border:1px solid var(--line);background:var(--p);color:var(--ink);padding:10px 13px;border-radius:12px;font-weight:750;cursor:pointer}.btn.active,.btn.primary{background:var(--ink);color:#fff}.btn.bad{color:var(--bad)}.btn.ok{color:var(--ok)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}.stat{background:#ffffffbf;border:1px solid var(--line);border-radius:13px;padding:11px}.stat b{display:block;font-size:1.2rem}.stat span{font-size:.8rem;color:var(--muted)}.card{border-radius:24px;min-height:430px;padding:clamp(24px,5vw,45px);display:flex;flex-direction:column;cursor:pointer}.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:850}.term{font-size:clamp(2.1rem,8vw,4.4rem);line-height:1.03;margin:auto 0}.answer{display:none}.card.flipped .question{display:none}.card.flipped .answer{display:block}.definition{font-size:clamp(1.05rem,2.8vw,1.35rem);line-height:1.55}.learn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.box{padding:14px;border-radius:14px;background:#f7f8fc;border:1px solid var(--line)}.box b{display:block;margin-bottom:5px}.box p{margin:0;line-height:1.45}.hint{text-align:center;color:var(--muted);margin-top:auto}.actions{justify-content:center}.quiz{display:none;border-radius:24px;padding:clamp(24px,5vw,42px);min-height:430px}.quiz.show{display:block}.choices{display:grid;gap:9px}.choice{text-align:left;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--p)}.choice.correct{background:#ecfdf3;border-color:#12b76a}.choice.wrong{background:#fef3f2;border-color:#f04438}.foot{text-align:center;color:var(--muted);font-size:.82rem;margin-top:16px}@media(max-width:650px){.panel{grid-template-columns:1fr 1fr}.panel input{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.learn{grid-template-columns:1fr}.card,.quiz{min-height:500px}}@media(prefers-color-scheme:dark){:root{--bg:#101522;--p:#171e2d;--ink:#f4f6fb;--muted:#a8b0c0;--line:#2a3448}body{background:linear-gradient(145deg,#101522,#151528)}.stat{background:#171e2dcc}.box{background:#121827}.choice.correct{background:#0e2d21}.choice.wrong{background:#351a1e}}
</style></head><body><main class="app"><header class="top"><div><h1>Six Sigma Flashcards</h1><p>204 concepts with examples and mastery tracking</p></div><div class="pill" id="count">1 / 204</div></header><section class="panel"><input id="search" placeholder="Search cards"><select id="group"><option value="all">All groups</option><option value="1">Group 1</option><option value="2">Group 2</option><option value="3">Group 3</option><option value="4">Group 4</option></select><select id="mastery"><option value="all">All mastery</option><option value="new">New</option><option value="learning">Learning</option><option value="known">Known</option></select></section><nav class="tabs"><button class="btn active" data-mode="study">Study</button><button class="btn" data-mode="quiz">Quiz</button><button class="btn" id="shuffle">Shuffle</button><button class="btn" id="reset">Reset progress</button></nav><section class="stats"><div class="stat"><b id="total">204</b><span>Matching</span></div><div class="stat"><b id="known">0</b><span>Known</span></div><div class="stat"><b id="learning">0</b><span>Learning</span></div><div class="stat"><b id="pct">0%</b><span>Mastery</span></div></section><section id="study"><article class="card" id="card"><div class="question"><div class="eyebrow" id="meta"></div><h2 class="term" id="term"></h2></div><div class="answer"><div class="eyebrow">Definition</div><p class="definition" id="definition"></p><div class="learn"><div class="box"><b>Plain English</b><p id="plain"></p></div><div class="box"><b>Example</b><p id="example"></p></div></div></div><p class="hint">Tap the card to flip it</p></article><div class="actions"><button class="btn" id="prev">← Previous</button><button class="btn bad" id="again">Study again</button><button class="btn primary" id="flip">Flip</button><button class="btn ok" id="know">I know this</button><button class="btn" id="next">Next →</button></div></section><section class="quiz" id="quiz"><div class="eyebrow">Choose the best definition</div><h2 id="qterm"></h2><div class="choices" id="choices"></div><p id="feedback"></p><button class="btn primary" id="nextq">Next question</button> <span id="score">Score: 0 / 0</span></section><div class="foot">Your progress is saved only in this browser.</div></main><script src="cards1.js"></script><script src="cards2.js"></script><script src="cards3.js"></script><script src="cards4.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let prog=JSON.parse(localStorage.getItem('sixSigmaProgress')||'{}'),list=[],i=0,mode='study',score=0,asked=0,answered=false,qcard=null;CARDS.forEach((c,n)=>c.id=n+1);const lvl=id=>prog[id]?.level||'new',save=()=>localStorage.setItem('sixSigmaProgress',JSON.stringify(prog));function simplify(t){return t.replace(/\s+/g,' ').replace(/^A |^An |^The /,'').replace(/ involves | is | refers to /i,' means ').slice(0,260)}function filter(){let q=$('#search').value.toLowerCase(),g=$('#group').value,m=$('#mastery').value;list=CARDS.filter(c=>(g==='all'||String(c.g)===g)&&(m==='all'||lvl(c.id)===m)&&(!q||(c.t+' '+c.d).toLowerCase().includes(q)));i=Math.min(i,Math.max(0,list.length-1));render()}function stats(){let k=CARDS.filter(c=>lvl(c.id)==='known').length,l=CARDS.filter(c=>lvl(c.id)==='learning').length;$('#total').textContent=list.length;$('#known').textContent=k;$('#learning').textContent=l;$('#pct').textContent=Math.round(k/CARDS.length*100)+'%'}function render(){stats();let c=list[i];if(!c){$('#count').textContent='0 / 0';$('#term').textContent='No cards found';$('#definition').textContent='Try changing your filters.';return}$('#card').classList.remove('flipped');$('#count').textContent=`${i+1} / ${list.length}`;$('#meta').textContent=`Group ${c.g} • ${lvl(c.id)}`;$('#term').textContent=c.t;$('#definition').textContent=c.d;$('#plain').textContent=simplify(c.d);$('#example').textContent=`Think of one work, school, or daily-life example of “${c.t}.”`;if(mode==='quiz')newQ()}function move(n){if(!list.length)return;i=(i+n+list.length)%list.length;render()}function mark(level){let c=list[i];if(!c)return;prog[c.id]={level};save();move(1)}function setMode(m){mode=m;$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('#study').style.display=m==='study'?'block':'none';$('#quiz').classList.toggle('show',m==='quiz');if(m==='quiz')newQ()}function newQ(){if(!list.length)return;answered=false;$('#feedback').textContent='';qcard=list[Math.floor(Math.random()*list.length)];$('#qterm').textContent=qcard.t;let wrong=CARDS.filter(c=>c.id!==qcard.id).sort(()=>Math.random()-.5).slice(0,3),opts=[qcard,...wrong].sort(()=>Math.random()-.5);$('#choices').innerHTML='';opts.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c.d;b.onclick=()=>answer(b,c.id===qcard.id);$('#choices').appendChild(b)});$('#score').textContent=`Score: ${score} / ${asked}`}function answer(b,ok){if(answered)return;answered=true;asked++;if(ok){score++;b.classList.add('correct');$('#feedback').textContent='Correct.';prog[qcard.id]={level:'known'}}else{b.classList.add('wrong');$('#feedback').textContent='Not quite. The correct answer is highlighted.';[...$('#choices').children].find(x=>x.textContent===qcard.d)?.classList.add('correct');prog[qcard.id]={level:'learning'}}save();stats();$('#score').textContent=`Score: ${score} / ${asked}`}
$('#search').oninput=filter;$('#group').onchange=filter;$('#mastery').onchange=filter;$('#card').onclick=()=>$('#card').classList.toggle('flipped');$('#flip').onclick=()=>$('#card').classList.toggle('flipped');$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#again').onclick=()=>mark('learning');$('#know').onclick=()=>mark('known');$('#nextq').onclick=newQ;$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#shuffle').onclick=()=>{list.sort(()=>Math.random()-.5);i=0;render()};$('#reset').onclick=()=>{if(confirm('Reset all progress?')){prog={};save();filter()}};filter();
</script></body></html>
